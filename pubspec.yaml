name: himal_video_player
description: HIMAL - The ultimate free & open-source cross-platform video player. Plays every format, codec, HDR (HDR/HDR+/HDR10/HDR10+/Dolby Vision), and audio format on Windows, Linux, macOS, iOS and Android.
publish_to: "none"
version: 1.0.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Playback engine (libmpv + FFmpeg) -> universal format/codec/HDR support
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # State management
  provider: ^6.1.2

  # File / storage
  file_picker: ^8.0.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  path: ^1.9.0

  # Desktop windowing
  window_manager: ^0.3.9

  # UX helpers

  url_launcher: ^6.3.0
  http: ^1.2.1
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  rxdart: ^0.27.7

  # Icons
  cupertino_icons: ^1.0.8
  fluentui_system_icons: ^1.1.234

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/