name: Feature request
description: Suggest a new feature for HIMAL Video Player
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platform
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - iOS
        - Android
        - All