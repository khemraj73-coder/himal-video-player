name: Daily Health Check

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,ios,linux,macos,windows .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        id: analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        id: test
        run: flutter test
        continue-on-error: true
      - name: Open issue on failure
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily health check failed";
            const body = "Automated daily health check detected failures.\n\n- Analyze: ${{ steps.analyze.outcome }}\n- Test: ${{ steps.test.outcome }}\n\nSee workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["auto-health"],
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auto-health", "bug"],
              });
            }