name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - run: flutter create --project-name himal_video_player --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../himal-windows.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: himal-windows
          path: build/himal-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create --project-name himal_video_player --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: cd build/linux/x64/release && tar -czf bundle.tar.gz bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: himal-linux
          path: build/linux/x64/release/bundle.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - run: flutter create --project-name himal_video_player --platforms=macos .
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: cd build/macos/Build/Products/Release && zip -r himal-macos.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: himal-macos
          path: build/macos/Build/Products/Release/himal-macos.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - run: flutter create --project-name himal_video_player --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: himal-android
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - run: flutter create --project-name himal_video_player --platforms=ios .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: himal-ios
          path: build/ios/iphoneos/*.app

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      - run: flutter create --project-name himal_video_player --platforms=web .
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: himal-web
          path: build/web/

  release:
    needs: [build-windows, build-linux, build-macos, build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*